<script type="module">
    import { db, initHeader } from "./firebase-config.js";
    import { collection, getDocs, doc, getDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { setLanguage, getLanguage, translations, updateTranslationsDictionary } from "/assets/i18n.js";

    initHeader();

    window.changeLang = (lang) => {
        setLanguage(lang);
    };

    async function cargarTraduccionesDinamicas() {
        try {
            const docSnap = await getDoc(doc(db, "site_translations", "translations"));
            if (docSnap.exists()) {
                updateTranslationsDictionary(docSnap.data());
                setLanguage(getLanguage());
            }
        } catch (e) {
            console.log("Usando traducciones locales por defecto:", e);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        setLanguage(getLanguage());
        await cargarTraduccionesDinamicas();
    });

    window.addEventListener('scroll', function() {
        const header = document.getElementById('site-header');
        if (window.scrollY > 20) {
            header.classList.add('navbar-scrolled');
        } else {
            header.classList.remove('navbar-scrolled');
        }
    });
    
</script>
